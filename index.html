<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5c4b">
  <meta name="description" content="Une liste de courses mobile simple et modifiable.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mes courses">
  <title>Ma liste de courses</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">À la maison et en magasin</p>
        <h1>Ma liste de courses</h1>
      </div>
    </header>

    <main>
      <section id="coursesView" class="view" aria-labelledby="coursesTab">
        <div class="summary-card">
          <div><strong id="remainingCount">0</strong><span>à prendre</span></div>
          <div class="summary-divider" aria-hidden="true"></div>
          <div><strong id="purchasedCount">0</strong><span>dans le caddie</span></div>
        </div>
        <div class="course-actions">
          <button class="share-list-button" id="shareList">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg>
            <span>Partager</span>
          </button>
          <button class="reset-list-button" id="resetList" aria-label="Réinitialiser la liste de courses">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
            <span>Réinitialiser</span>
          </button>
        </div>
        <div id="courseGroups" class="groups"></div>
        <div id="emptyCourses" class="empty-state" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 7h15l-2 8H8L6 3H3m6 16h.01M18 19h.01"/></svg>
          <h2>La liste est vide</h2>
          <p>Ajoute des produits depuis l’onglet Produits.</p>
          <button class="primary-button" id="openProducts">Choisir des produits</button>
        </div>
      </section>

      <section id="productsView" class="view" aria-labelledby="productsTab" hidden>
        <div class="product-toolbar">
          <label class="search-field">
            <span class="sr-only">Rechercher un produit</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="searchInput" type="search" placeholder="Rechercher un produit" autocomplete="off">
          </label>
          <button class="primary-button compact" id="addProduct">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Ajouter
          </button>
        </div>
        <p class="catalog-count" id="catalogCount"></p>
        <div id="productGroups" class="groups"></div>
        <section class="backup-card" aria-labelledby="backupTitle">
          <div>
            <p class="eyebrow">Copie personnelle</p>
            <h2 id="backupTitle">Sauvegarde</h2>
            <p>Enregistre tous tes produits dans un fichier, ou restaure une sauvegarde existante.</p>
          </div>
          <div class="backup-actions">
            <button class="primary-button" id="backupData" type="button">Sauvegarder mes données</button>
            <button class="secondary-button" id="restoreData" type="button">Restaurer mes données</button>
          </div>
          <input class="sr-only" id="restoreFile" type="file" accept="application/json,.json">
        </section>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <button id="coursesTab" class="nav-item active" aria-current="page">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 7h15l-2 8H8L6 3H3m6 16h.01M18 19h.01"/></svg>
        <span>Courses</span>
        <span class="nav-badge" id="courseBadge">0</span>
      </button>
      <button id="productsTab" class="nav-item">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span>Produits</span>
      </button>
    </nav>
  </div>

  <dialog id="productDialog">
    <form method="dialog" id="productForm">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">Catalogue global</p>
          <h2 id="dialogTitle">Ajouter un produit</h2>
        </div>
        <button class="icon-button quiet" type="button" id="closeDialog" aria-label="Fermer">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <label>Nom du produit<input id="productName" required maxlength="80" autocomplete="off"></label>
      <label>Rayon<select id="productRayon" required></select></label>
      <p class="field-error" id="formError" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="secondary-button" id="cancelDialog">Annuler</button>
        <button type="submit" class="primary-button">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
